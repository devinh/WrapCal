name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A queued run is not canceled, so a deployment that has already
# started is never killed halfway through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # One target, because the build lives in Cake and not here: `Release` builds, runs both
      # suites — including the functional one, which installs the browser it needs — and
      # publishes the site to ./output. What the artifact is, and where it lands, is
      # cake/cake.cs's business; this file only moves it. --coverage adds the coverage report
      # the next step uploads; it changes nothing about the site itself.
      - name: Build, test and publish
        run: ./cake.sh --target=Release --coverage

      # The same reports ci.yml uploads, kept with the deploy that produced them. They sit
      # beside output/wwwroot rather than inside it, so nothing here reaches the published site.
      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: output/reports
          if-no-files-found: warn

      # Pages is already pointed at GitHub Actions for this repository, so this only reads its
      # configuration — it is not asked to enable anything.
      - uses: actions/configure-pages@v6

      # output/wwwroot, not output: publish also writes host files beside it that a static host
      # ignores. Deploying through Actions means no Jekyll, so _framework/ is served as-is and
      # no .nojekyll is needed. A branch-based deployment would need one.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: output/wwwroot

      - id: deployment
        uses: actions/deploy-pages@v5
