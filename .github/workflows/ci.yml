name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same pull request makes the previous run pointless.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Both suites, through Cake — including the functional one, which is what catches a
      # dependency bump that changes how the page looks. Cake installs the browser it needs.
      - name: Build and test
        run: ./cake.sh --target=Tests
