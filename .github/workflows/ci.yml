name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # Only for the coverage comment below. Nothing else here writes to the repository.
  pull-requests: write

# A new push to the same pull request makes the previous run pointless.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Both suites, through Cake — including the functional one, which is what catches a
      # dependency bump that changes how the page looks. Cake installs the browser it needs.
      # --coverage is the whole difference from a local run: it instruments the unit suite and
      # has ReportGenerator write the summary the next two steps publish.
      - name: Build and test
        run: ./cake.sh --target=Tests --coverage

      # always(), because a failing suite is exactly when its report is worth opening. Whatever
      # the run got as far as producing is in output/reports: the TUnit HTML report and TRX for
      # each suite, and the coverage HTML.
      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: output/reports
          if-no-files-found: warn

      # --edit-last --create-if-none keeps this to one comment per pull request: a later run
      # updates the comment the earlier one left, rather than adding another. Guarded on the
      # file's existence because a run that failed before reaching ReportGenerator has no
      # summary — leaving the previous comment alone is better than replacing it with nothing.
      # The fork check is there because a pull request from a fork gets a read-only token, and
      # commenting with one fails the whole run.
      - name: Comment the coverage summary
        if: >-
          always()
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && hashFiles('output/reports/coverage/SummaryGithub.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --edit-last --create-if-none \
            --body-file output/reports/coverage/SummaryGithub.md
