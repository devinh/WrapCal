name: renovate

on:
  schedule:
    # Once daily. Offset from the k3s repository's run so the two do not start together.
    - cron: "23 6 * * *"
  workflow_dispatch:
    inputs:
      log_level:
        description: "Renovate log level (DEBUG to troubleshoot)"
        required: false
        default: "INFO"
        type: choice
        options:
          - INFO
          - DEBUG
          - WARN

jobs:
  renovate:
    runs-on: ubuntu-latest
    # Renovate authenticates as the devinh-renovate App, so GITHUB_TOKEN only
    # needs to check out this repo.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # Authenticate as a GitHub App rather than a PAT: fine-grained PATs cannot
      # be granted "Checks: read" (only GitHub Apps can read check runs), and
      # without it Renovate sees no successful checks, resolves the branch status
      # as "yellow", and silently refuses to automerge.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
      - uses: renovatebot/github-action@v46.3.11
        with:
          configurationFile: .github/renovate.json
          token: ${{ steps.app-token.outputs.token }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM: github
          LOG_LEVEL: ${{ inputs.log_level || 'INFO' }}
