<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WrapCal</title>
    <base href="/" />
    <!--
      A GitHub project page serves the site from /<repository>/, so the base every relative URL
      is resolved against has to follow wherever index.html actually sits. Raised here, and
      before the links and scripts below, because a relative URL is resolved against the base in
      force when its element is parsed — not when it is fetched. Served from the root this does
      nothing, which is why local development and the tests need no configuration of their own.
    -->
    <script>
        (function () {
            var directory = location.pathname.replace(/[^/]*$/, "");
            if (directory && directory !== "/") {
                document.querySelector("base").href = directory;
            }
        })();
    </script>

    <!--
      Here rather than at the end of the body, because the shell below has to be drawn in the
      reader's theme before the runtime has downloaded — and that means reading its cookies
      before anything renders. Kept ahead of the stylesheets so the theme is chosen first.
    -->
    <script src="theme.js"></script>

    <!-- Zoom on the cut layout. A non-passive wheel listener is the one thing Blazor cannot give
         us, and it has to exist before the drawing does. -->
    <script src="diagram.js"></script>

    <!--
      The app is a blank shell until the WebAssembly runtime has downloaded, rendered, and had
      MudBlazor paint its palette. Without this the shell is white whatever theme the reader
      chose, which is a white flash on every load for anyone in dark mode.

      This mirrors MainLayout's rule exactly, including its fallbacks: an explicit choice wins,
      otherwise the system preference the browser reported last time, otherwise light. It
      deliberately does not consult `prefers-color-scheme`, because the app does not either —
      agreeing with the app matters more here than being independently right, and a shell that
      disagreed would flash twice instead of once.
    -->
    <script>
        (function () {
            var preferences = window.wrapcalTheme && window.wrapcalTheme.load();
            var choice = (preferences && preferences.choice) || "system";
            var isDark = choice === "dark"
                || (choice !== "light" && !!preferences && preferences.system === "dark");

            document.documentElement.dataset.bootTheme = isDark ? "dark" : "light";
        })();
    </script>

    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="WrapCal.styles.css" />
    <link rel="stylesheet" href="_content/MudBlazor/MudBlazor.min.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <script type="importmap"></script>
</head>

<body>
    <!-- Filled by the first render, which replaces this placeholder wholesale. -->
    <div id="app">
        <div class="loading-indicator">Loading…</div>
    </div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
