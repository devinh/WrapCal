<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WrapCal</title>
    <base href="/" />
    <!--
      A GitHub project page serves the site from /<repository>/, so the base every relative URL
      is resolved against has to follow wherever index.html actually sits. Raised here, and
      before the links and scripts below, because a relative URL is resolved against the base in
      force when its element is parsed — not when it is fetched. Served from the root this does
      nothing, which is why local development and the tests need no configuration of their own.
    -->
    <script>
        (function () {
            var directory = location.pathname.replace(/[^/]*$/, "");
            if (directory && directory !== "/") {
                document.querySelector("base").href = directory;
            }
        })();
    </script>
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="WrapCal.styles.css" />
    <link rel="stylesheet" href="_content/MudBlazor/MudBlazor.min.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <script type="importmap"></script>
</head>

<body>
    <!-- Filled by the first render, which replaces this placeholder wholesale. -->
    <div id="app">
        <div class="loading-indicator">Loading…</div>
    </div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <!-- Loaded before the runtime: MainLayout reads the theme cookies on its first render. -->
    <script src="theme.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
